[Rainmeter]
Update=30000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Team Graph
Author=LimbusSpace
Information=GitHub-only team graph status monitor
Version=1.0

[Variables]
FeedUrl=https://limbusspace.github.io/team-graph/data/status.json
TextColor=242,246,242,255
MutedColor=170,181,174,255
AccentColor=239,181,91,255
PanelColor=25,34,31,235
Font=Segoe UI

[WebParser]
Measure=WebParser
URL=#FeedUrl#
UpdateRate=30
RegExp=(?siU)"progress"\s*:\s*(\d+).*"completed"\s*:\s*(\d+).*"total"\s*:\s*(\d+).*"frontier"\s*:\s*(\d+).*"blocked"\s*:\s*(\d+).*"pendingEvidence"\s*:\s*(\d+)

[Background]
Meter=Shape
Shape=Rectangle 0,0,320,178,10 | Fill Color #PanelColor# | StrokeWidth 0

[Title]
Meter=String
X=18
Y=14
FontFace=#Font#
FontSize=14
FontColor=#TextColor#
FontWeight=600
Text=具身项目依赖台

[Subtitle]
Meter=String
X=18
Y=39
FontFace=#Font#
FontSize=9
FontColor=#MutedColor#
Text=GitHub 状态 · 每 30 秒更新

[Progress]
Meter=String
MeasureName=WebParser
StringIndex=1
X=18
Y=66
FontFace=#Font#
FontSize=30
FontColor=#AccentColor#
Text=%1%%

[Counts]
Meter=String
X=94
Y=72
FontFace=#Font#
FontSize=11
FontColor=#TextColor#
Text=完成 %2 / %3

[Signals]
Meter=String
X=18
Y=118
FontFace=#Font#
FontSize=10
FontColor=#TextColor#
Text=可开工  %4    阻塞  %5    待审证据  %6

[OpenBoard]
Meter=String
X=18
Y=150
FontFace=#Font#
FontSize=9
FontColor=#MutedColor#
Text=打开共享看板
LeftMouseUpAction=["https://limbuspace.github.io/team-graph/"]
